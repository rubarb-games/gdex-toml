# Item Fx

# Setup the different types of Item Fx here, and reference them
# in the item definitions.
# When specifying item_fx = "hand_pickaxe" in an item definition,
# the system expects to find a [item_fx.hand_pickaxe]

# Enter the scene name without file ending. The system will look for 
# the scene in prefabs/item_fx

[item_fx.hand_pickaxe]
scene = "itemfx_hand_pickaxe"

[item_fx.hand_shake]
scene = "itemfx_hand_shake"

[item_fx.hand_throw]
scene = "itemfx_hand_throw"

# Items

# Important! The id of the item must match a value in Enums.Item
# item.pickaxe expects a corresponding enum called Enums.Item.PICKAXE

[item.pickaxe]
tier = 0
icon_color = "icon_item_pickaxe"
icon_closeup = "closeup/icon_item_closeup_placeholder"
atlas_pos = [2, 8]
price = ["gravel:100"]
script = "item_pickaxe"
item_fx = "hand_pickaxe"
unlock_type = 1 # none, always, unlocked_by_progression, locked_in_demo
challenge = "ALWAYS_UNLOCKED"

