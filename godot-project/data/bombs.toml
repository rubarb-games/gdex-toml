[config]
# any common settings for all bombs


# Important! The id of the bomb must match a value in Enums.GemType
# [bomb.line] expects an enum called GemType.BOMB_LINE
# 
# script = Looks for a script in 'scripts/bombs/' called 'bomb_xxx.gd' where xxx
#          is the part you entered. So, script = "line" will point to
#          'scripts/bombs/bomb_line.gd'
# icon_xx =            optionals. if 'icon_color' is missing, a picture of 
#                      Jack will be inserted
# price and currency = optional. If missing, an empty price table will be
#                      inserted, making the bomb free to purchase

[bomb.causticflask]
category = "OTHER"
icon_color = "icon_bomb_crossswap_B"
icon_silhouette = "specials/icon_bomb_crossswap_B_special"
atlas_pos = [6, 7]
price = ["gravel:100"]
script = "causticflask"
challenge = "NONE"

